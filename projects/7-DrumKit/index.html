<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum kit sounds</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="keys">
        <div data-key="65" class="key" role="button" tabindex="0" aria-label="Clap, key A">
          <kbd>A</kbd>
          <span class="sound">clap</span>
        </div>
        <div data-key="83" class="key" role="button" tabindex="0" aria-label="Hihat, key S">
          <kbd>S</kbd>
          <span class="sound">hihat</span>
        </div>
        <div data-key="68" class="key" role="button" tabindex="0" aria-label="Kick, key D">
          <kbd>D</kbd>
          <span class="sound">kick</span>
        </div>
        <div data-key="70" class="key" role="button" tabindex="0" aria-label="Openhat, key F">
          <kbd>F</kbd>
          <span class="sound">openhat</span>
        </div>
        <div data-key="71" class="key" role="button" tabindex="0" aria-label="Boom, key G">
          <kbd>G</kbd>
          <span class="sound">boom</span>
        </div>
        <div data-key="72" class="key" role="button" tabindex="0" aria-label="Ride, key H">
          <kbd>H</kbd>
          <span class="sound">ride</span>
        </div>
        <div data-key="74" class="key" role="button" tabindex="0" aria-label="Snare, key J">
          <kbd>J</kbd>
          <span class="sound">snare</span>
        </div>
        <div data-key="75" class="key" role="button" tabindex="0" aria-label="Tom, key K">
          <kbd>K</kbd>
          <span class="sound">tom</span>
        </div>
        <div data-key="76" class="key" role="button" tabindex="0" aria-label="Tink, key L">
          <kbd>L</kbd>
          <span class="sound">tink</span>
        </div>
      </div>
    
      <audio data-key="65" src="sounds/clap.wav" preload ></audio>
      <audio data-key="83" src="sounds/hihat.wav" preload ></audio>
      <audio data-key="68" src="sounds/kick.wav" preload ></audio>
      <audio data-key="70" src="sounds/openhat.wav" preload ></audio>
      <audio data-key="71" src="sounds/boom.wav" preload ></audio>
      <audio data-key="72" src="sounds/ride.wav" preload ></audio>
      <audio data-key="74" src="sounds/snare.wav" preload ></audio>
      <audio data-key="75" src="sounds/tom.wav" preload></audio>
      <audio data-key="76" src="sounds/tink.wav" preload ></audio>


    <script src="script.js"></script>
</body>
</html>
