<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Lab</title>
    <meta name="description" content="A collection of JavaScript projects and UI experiments.">
    <link rel="shortcut icon" href="dist/img/javascript.svg" type="image/x-icon">
    <link rel="stylesheet" href="dist/css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <div>
                <h1 class="site-title">JavaScript <span class="site-title-mark">Lab</span></h1>
                <p class="site-subtitle">A collection of JavaScript projects and UI experiments.</p>
            </div>
            <a class="profile-link" href="https://github.com/RoqayaMourad">GitHub profile</a>
        </div>
    </header>

    <main class="container">
        <section aria-labelledby="projects-title">
            <h2 class="visually-hidden" id="projects-title">Projects</h2>
            <!-- the cards are built from the project list in dist/js/script.js -->
            <ul class="project-grid" id="project-grid"></ul>
            <noscript>
                <p class="no-script">The project list needs JavaScript. You can also browse the code on <a href="https://github.com/RoqayaMourad/JS-projects">GitHub</a>.</p>
            </noscript>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <h2 class="footer-title">Credits</h2>
            <ul class="credits">
                <li>Drum Kit: background photo by <a href="https://www.pexels.com/photo/3721941/">Daniel Reche on Pexels</a>.</li>
            </ul>
        </div>
    </footer>

    <script src="dist/js/script.js"></script>
</body>
</html>
